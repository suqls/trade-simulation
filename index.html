<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}*,*::before,*::after{box-sizing:border-box}img{max-width:100%}[hidden]{display:none!important}</style>
<title>두 나라의 선택</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap">
<style>
/* Layout: 한 테이블이 기기 한 대를 공유. 위쪽 상태바, 가운데 A국·B국 패널 좌우 대칭, 아래 무역 창구 */
:root{
  --bg:#eef1f4; --surface:#ffffff; --line:#d5dbe2; --fg:#18222d; --muted:#5d6b79;
  --a:#1f5fa8; --a-soft:#e3ecf7; --b:#b5651d; --b-soft:#f6ebdf;
  --good:#2e7d4f; --warn:#b3261e;
  --display:"Black Han Sans","IBM Plex Sans KR",system-ui,sans-serif;
  --body:"IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11161c; --surface:#1a2129; --line:#2c3642; --fg:#e7ecf1; --muted:#97a4b2;
  --a:#6fa5e6; --a-soft:#1b2a3c; --b:#e3a062; --b-soft:#33261a; --good:#5cbf86; --warn:#ef7a70; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11161c; --surface:#1a2129; --line:#2c3642; --fg:#e7ecf1; --muted:#97a4b2;
  --a:#6fa5e6; --a-soft:#1b2a3c; --b:#e3a062; --b-soft:#33261a; --good:#5cbf86; --warn:#ef7a70; color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.5}
.wrap{max-width:1040px;margin:0 auto;padding-block:20px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:16px}
h1,h2,h3{margin:0;text-wrap:balance}
h1{font-family:var(--display);font-weight:400;font-size:clamp(26px,4vw,34px);letter-spacing:.01em}
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px}
.round-tag{font-size:13px;font-weight:700;letter-spacing:.06em;color:var(--muted)}
.timer{display:flex;align-items:center;gap:8px}
.clock{font-family:var(--display);font-size:30px;font-variant-numeric:tabular-nums;min-width:4.2ch;text-align:right}
.clock.low{color:var(--warn)}
button{font:inherit;cursor:pointer;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:8px 14px;font-weight:500}
button:focus-visible{outline:3px solid var(--a);outline-offset:2px}
button:disabled{opacity:.4;cursor:not-allowed}
.primary{background:var(--fg);color:var(--bg);border-color:var(--fg);font-weight:700}
.rule{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 16px;color:var(--muted);font-size:14px}
.rule b{color:var(--fg)}
.board{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:720px){.board{grid-template-columns:1fr}}
.nation{background:var(--surface);border:1px solid var(--line);border-top:6px solid var(--c);border-radius:14px;padding:16px;display:grid;gap:14px;min-width:0}
.nation.A{--c:var(--a);--soft:var(--a-soft)} .nation.B{--c:var(--b);--soft:var(--b-soft)}
.nhead{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.nhead h2{font-family:var(--display);font-weight:400;font-size:28px;color:var(--c)}
.nhead small{color:var(--muted);font-size:13px}
.label{font-size:12px;font-weight:700;letter-spacing:.08em;color:var(--muted)}
.coins{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.coin{width:24px;height:24px;border-radius:50%;background:var(--c);box-shadow:inset 0 -3px 0 rgba(0,0,0,.18);transition:transform .25s,opacity .25s}
.coin.spent{background:transparent;border:2px dashed var(--line);box-shadow:none}
.coin.pop{animation:pop .35s ease}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.35)}100%{transform:scale(1)}}
.prod{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.prod button{background:var(--soft);border-color:transparent;padding:12px 8px;display:grid;gap:2px;text-align:center}
.prod button strong{font-size:16px}
.prod button span{font-size:13px;color:var(--muted)}
.inv{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;text-align:center}
.inv div{background:var(--bg);border-radius:10px;padding:10px 4px}
.inv .num{font-family:var(--display);font-size:28px;font-variant-numeric:tabular-nums;line-height:1.1}
.inv .score .num{color:var(--c)}
.trade{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;gap:14px}
.trade.locked{opacity:.55}
.trade-row{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:center}
@media (max-width:620px){.trade-row{grid-template-columns:1fr}.arrow{display:none}}
.stepper{display:flex;align-items:center;gap:8px;background:var(--bg);border-radius:10px;padding:8px 10px;justify-content:space-between}
.stepper .who{font-size:14px}
.stepper input{width:3.6ch;font:inherit;font-weight:700;font-size:20px;text-align:center;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--fg);padding:2px 0;font-variant-numeric:tabular-nums}
.stepper button{padding:4px 10px}
.arrow{font-size:22px;color:var(--muted)}
.trade-foot{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.msg{font-size:14px;color:var(--muted)} .msg.err{color:var(--warn)}
.log{margin:0;padding:0;list-style:none;display:grid;gap:6px;font-size:14px}
.log li{background:var(--bg);border-radius:8px;padding:6px 10px;font-variant-numeric:tabular-nums}
.result{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;display:grid;gap:16px}
.result h2{font-family:var(--display);font-weight:400;font-size:26px}
.compare{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.compare th,.compare td{padding:10px 8px;border-bottom:1px solid var(--line);text-align:right}
.compare th:first-child,.compare td:first-child{text-align:left}
.compare thead th{font-size:12px;letter-spacing:.06em;color:var(--muted)}
.up{color:var(--good);font-weight:700} .down{color:var(--warn);font-weight:700}
.tbl{overflow-x:auto}
.qs{margin:0;padding-left:20px;display:grid;gap:6px}
.answer{background:var(--bg);border-radius:10px;padding:12px 16px;font-size:14px;display:grid;gap:4px}
.actions{display:flex;flex-wrap:wrap;gap:10px}
.overlay{position:fixed;inset:0;background:rgba(10,15,20,.55);display:grid;place-items:center;padding:16px;z-index:20}
.pin{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;width:min(340px,100%);display:grid;gap:12px}
.pin h3{font-family:var(--display);font-weight:400;font-size:22px}
.pin input{font:inherit;font-size:24px;letter-spacing:.4em;text-align:center;padding:8px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--fg)}
.pin .actions{justify-content:flex-end}
.lock::before{content:"🔒 ";font-size:.9em}
.check{display:inline-block;font-size:13px;font-weight:700;padding:4px 10px;border-radius:999px}
.check.ok{background:var(--a-soft);color:var(--good)} .check.bad{background:var(--b-soft);color:var(--warn)}
details{font-size:14px} summary{cursor:pointer;color:var(--muted);font-weight:500}
details .log{margin-top:8px}
@media (prefers-reduced-motion:reduce){.coin{transition:none}.coin.pop{animation:none}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <div class="round-tag" id="roundTag">1라운드 · 자급자족</div>
      <h1>두 나라의 선택</h1>
    </div>
    <div class="timer">
      <span class="clock" id="clock">3:00</span>
      <button id="timerBtn">타이머 시작</button>
    </div>
  </header>

  <div class="rule" id="ruleBox"></div>

  <section class="board" id="board"></section>

  <section class="trade" id="trade">
    <div class="nhead"><h3>무역 창구</h3><span class="label" id="tradeState">2라운드부터 열립니다</span></div>
    <div class="trade-row">
      <div class="stepper"><span class="who">A국 → B국<br><b>휴대폰</b></span>
        <span><button data-step="give,-1" aria-label="휴대폰 줄이기">−</button>
        <input id="give" type="number" min="0" value="0" inputmode="numeric" aria-label="A국이 주는 휴대폰 수">
        <button data-step="give,1" aria-label="휴대폰 늘리기">+</button></span></div>
      <span class="arrow" aria-hidden="true">⇄</span>
      <div class="stepper"><span class="who">B국 → A국<br><b>신발</b></span>
        <span><button data-step="get,-1" aria-label="신발 줄이기">−</button>
        <input id="get" type="number" min="0" value="0" inputmode="numeric" aria-label="B국이 주는 신발 수">
        <button data-step="get,1" aria-label="신발 늘리기">+</button></span></div>
    </div>
    <div class="trade-foot">
      <span class="msg" id="tradeMsg">두 나라가 합의한 수량을 넣고 교환하세요.</span>
      <button class="primary" id="tradeBtn">교환 확정</button>
    </div>
    <ul class="log" id="log"></ul>
  </section>

  <div class="actions"><button class="primary" id="endBtn">1라운드 종료</button><button id="resetBtn">처음부터</button></div>

  <section class="result" id="result" hidden></section>
</div>

<div class="overlay" id="pinBox" hidden>
  <form class="pin" id="pinForm">
    <h3>교사 확인</h3>
    <span class="msg" id="pinWhat"></span>
    <input id="pinInput" type="password" inputmode="numeric" maxlength="4" autocomplete="off" aria-label="교사용 비밀번호">
    <span class="msg err" id="pinErr" hidden>비밀번호가 맞지 않습니다.</span>
    <div class="actions"><button type="button" id="pinCancel">취소</button><button type="submit" class="primary">확인</button></div>
  </form>
</div>

<script>
const RATE={A:{phone:6,shoe:4,coins:5,name:"A국",desc:"기술 선진국 · 코인 5개"},B:{phone:1,shoe:2,coins:15,name:"B국",desc:"인구 많은 개도국 · 코인 15개"}};
const ROUND_MIN={1:3,2:4}, PIN="1207", KEY="trade-game-state-v2";
const IT={phone:"휴대폰",shoe:"신발"}, UNIT={phone:"개",shoe:"켤레"};
let S,left=180,tick=null;
function fresh(){return{round:1,phase:"play",r1:null,r2:null,trades:[],log:[],n:{A:mk("A"),B:mk("B")}}}
function mk(k){return{coins:RATE[k].coins,phone:0,shoe:0}}
const score=c=>Math.min(c.phone,c.shoe);
const $=id=>document.getElementById(id);

/* 저장: 새로고침해도 이어서 진행 */
function save(){try{localStorage.setItem(KEY,JSON.stringify({S,left}))}catch(e){}}
function load(){try{const d=JSON.parse(localStorage.getItem(KEY));if(d&&d.S&&d.S.n){S=d.S;left=d.left??ROUND_MIN[S.round]*60;return true}}catch(e){}return false}

/* 기록으로 다시 계산해 현재 상태와 맞는지 확인 */
function replay(round){
  const n={A:mk("A"),B:mk("B")};let ok=true;
  for(const e of S.log.filter(x=>x.round===round)){
    if(e.type==="make"){const c=n[e.k];if(c.coins<1)ok=false;c.coins--;c[e.item]+=RATE[e.k][e.item]}
    else{n.A.phone-=e.give;n.B.phone+=e.give;n.B.shoe-=e.get;n.A.shoe+=e.get;if(n.A.phone<0||n.B.shoe<0)ok=false}
  }
  return{n,ok}
}
function verify(round,scores){
  const {n,ok}=replay(round);
  return ok&&score(n.A)===scores.A&&score(n.B)===scores.B
    &&scores.A<=(round===1?12:30)&&scores.B<=(round===1?10:30)&&scores.A+scores.B<=(round===1?22:30)
}
function logList(round){
  const rows=S.log.filter(x=>x.round===round).map(e=>e.type==="make"
    ?`<li>${RATE[e.k].name} 코인 1개 → ${IT[e.item]} ${RATE[e.k][e.item]}${UNIT[e.item]}</li>`
    :`<li>교환 · A국 휴대폰 ${e.give}개 ⇄ B국 신발 ${e.get}켤레</li>`);
  return rows.length?`<ul class="log">${rows.join("")}</ul>`:`<p class="msg">기록 없음</p>`
}

/* 교사 비밀번호 창 */
let pinCb=null;
function askPin(what,cb){pinCb=cb;$("pinWhat").textContent=what;$("pinInput").value="";$("pinErr").hidden=true;$("pinBox").hidden=false;setTimeout(()=>$("pinInput").focus(),30)}
$("pinForm").onsubmit=e=>{e.preventDefault();
  if($("pinInput").value===PIN){$("pinBox").hidden=true;const cb=pinCb;pinCb=null;cb&&cb()}
  else{$("pinErr").hidden=false;$("pinInput").value="";$("pinInput").focus()}};
$("pinCancel").onclick=()=>{$("pinBox").hidden=true;pinCb=null};

function renderBoard(){
  $("board").innerHTML=["A","B"].map(k=>{
    const c=S.n[k],r=RATE[k],dis=c.coins===0||S.phase!=="play";
    const coins=Array.from({length:r.coins},(_,i)=>`<span class="coin ${i<c.coins?"":"spent"}"></span>`).join("");
    return `<article class="nation ${k}">
      <div class="nhead"><h2>${r.name}</h2><small>${r.desc}</small></div>
      <div><span class="label">남은 노동 코인 ${c.coins} / ${r.coins}</span><div class="coins">${coins}</div></div>
      <div class="prod">
        <button data-make="${k},phone" ${dis?"disabled":""}><strong>휴대폰 생산</strong><span>코인 1개 → 휴대폰 ${r.phone}개</span></button>
        <button data-make="${k},shoe" ${dis?"disabled":""}><strong>신발 생산</strong><span>코인 1개 → 신발 ${r.shoe}켤레</span></button>
      </div>
      <div class="inv">
        <div><div class="label">휴대폰</div><div class="num">${c.phone}</div></div>
        <div><div class="label">신발</div><div class="num">${c.shoe}</div></div>
        <div class="score"><div class="label">점수(세트)</div><div class="num">${score(c)}</div></div>
      </div></article>`}).join("");
}
function renderChrome(){
  const r2=S.round===2;
  $("roundTag").textContent=r2?"2라운드 · 무역 허용":"1라운드 · 자급자족";
  $("ruleBox").innerHTML=r2
    ?"<b>무역이 허용됩니다.</b> 생산 전에 협상해도 되고, 생산 후에 교환해도 됩니다. 한 번 쓴 코인은 돌아오지 않습니다. 휴대폰 1개 + 신발 1켤레 = 1점."
    :"<b>무역 금지.</b> 각 나라가 혼자 코인을 써서 생산하세요. 한 번 쓴 코인은 돌아오지 않습니다. 휴대폰 1개 + 신발 1켤레 = 1점, 남는 카드와 코인은 0점.";
  const open=r2&&S.phase==="play";
  $("trade").classList.toggle("locked",!open);
  $("tradeState").textContent=open?"교환 가능":r2?"라운드 종료":"2라운드부터 열립니다";
  $("trade").querySelectorAll("button,input").forEach(e=>e.disabled=!open);
  $("log").innerHTML=S.trades.map((t,i)=>`<li>${i+1}차 교환 · A국 휴대폰 ${t.give}개 ⇄ B국 신발 ${t.get}켤레</li>`).join("");
  $("endBtn").hidden=S.phase!=="play";
  $("endBtn").textContent=r2?"2라운드 종료":"1라운드 종료";
}
function render(){renderBoard();renderChrome();renderResult();save()}

function resultTable(round,sc){
  const good=verify(round,sc);
  return `<span class="check ${good?"ok":"bad"}">${good?"✓ 기록과 점수 일치":"✕ 기록과 점수가 맞지 않음"}</span>
    <details><summary>${round}라운드 생산·교환 기록 보기</summary>${logList(round)}</details>`
}
function renderResult(){
  const el=$("result");
  if(S.phase==="play"&&S.round===1){el.hidden=true;return}
  if(S.phase==="play"){el.hidden=true;return}
  el.hidden=false;
  if(S.round===1){
    el.innerHTML=`<h2>1라운드 결과</h2>
      <div class="tbl"><table class="compare"><thead><tr><th>나라</th><th>휴대폰</th><th>신발</th><th>점수</th></tr></thead><tbody>
      ${["A","B"].map(k=>`<tr><td>${RATE[k].name}</td><td>${S.n[k].phone}</td><td>${S.n[k].shoe}</td><td><b>${score(S.n[k])}</b></td></tr>`).join("")}
      <tr><td><b>테이블 합계</b></td><td></td><td></td><td><b>${S.r1.A+S.r1.B}</b></td></tr></tbody></table></div>
      ${resultTable(1,S.r1)}
      <p class="msg">선생님이 점수를 확인한 뒤 2라운드를 시작합니다. 코인과 상품은 처음 상태로 돌아갑니다.</p>
      <div class="actions"><button class="primary lock" id="startR2">2라운드 시작</button></div>`;
    $("startR2").onclick=()=>askPin("2라운드를 시작합니다.",()=>{S.round=2;S.phase="play";S.n={A:mk("A"),B:mk("B")};S.trades=[];setTimer(2);render();window.scrollTo({top:0,behavior:"smooth"})});
  }else{
    const d=k=>S.r2[k]-S.r1[k], fmt=v=>`<span class="${v>0?"up":v<0?"down":""}">${v>0?"+":""}${v}</span>`;
    const t1=S.r1.A+S.r1.B,t2=S.r2.A+S.r2.B;
    el.innerHTML=`<h2>최종 비교</h2>
      <div class="tbl"><table class="compare"><thead><tr><th>나라</th><th>1라운드</th><th>2라운드</th><th>변화</th></tr></thead><tbody>
      <tr><td>A국</td><td>${S.r1.A}</td><td>${S.r2.A}</td><td>${fmt(d("A"))}</td></tr>
      <tr><td>B국</td><td>${S.r1.B}</td><td>${S.r2.B}</td><td>${fmt(d("B"))}</td></tr>
      <tr><td><b>테이블 합계</b></td><td><b>${t1}</b></td><td><b>${t2}</b></td><td>${fmt(t2-t1)}</td></tr></tbody></table></div>
      <div style="display:grid;gap:8px">${resultTable(1,S.r1)}${resultTable(2,S.r2)}</div>
      <div><span class="label">정리 질문</span>
      <ol class="qs"><li>A국은 둘 다 더 잘 만드는데 왜 무역을 했을까?</li>
      <li>신발 1켤레를 만들려면 각 나라는 휴대폰을 몇 개 포기해야 할까?</li>
      <li>어떤 교환 비율이어야 두 나라 모두 이득일까?</li></ol></div>
      <div class="actions"><button class="lock" id="ansBtn">교사용 정답 보기</button><button class="primary lock" id="again">새 게임</button></div>
      <div class="answer" id="ans" hidden>
        <div>1라운드 최적: A국 12점(휴대폰 2코인·신발 3코인), B국 10점(휴대폰 10코인·신발 5코인), 합계 22점</div>
        <div>2라운드 최적: A국은 휴대폰만 30개, B국은 신발만 30켤레 → 휴대폰 15개와 신발 15켤레 교환 → 각 15점, 합계 30점</div>
        <div>기회비용: 신발 1켤레당 A국은 휴대폰 1.5개, B국은 0.5개를 포기 → B국은 신발, A국은 휴대폰에 비교우위</div>
        <div>두 나라 모두 이득인 교환 비율: 신발 1켤레당 휴대폰 0.5~1.5개</div>
      </div>`;
    $("ansBtn").onclick=()=>{
      if(!$("ans").hidden){$("ans").hidden=true;$("ansBtn").textContent="교사용 정답 보기";return}
      askPin("교사용 정답을 펼칩니다.",()=>{$("ans").hidden=false;$("ansBtn").textContent="정답 숨기기"})};
    $("again").onclick=()=>askPin("기록을 모두 지우고 새 게임을 시작합니다.",()=>{S=fresh();setTimer(1);render();window.scrollTo({top:0,behavior:"smooth"})});
  }
}

document.addEventListener("click",e=>{
  const m=e.target.closest("[data-make]");
  if(m){const [k,item]=m.dataset.make.split(",");const c=S.n[k];if(c.coins<1||S.phase!=="play")return;
    c.coins--;c[item]+=RATE[k][item];S.log.push({round:S.round,type:"make",k,item});render();
    const spent=document.querySelectorAll(`.nation.${k} .coin`)[c.coins];if(spent)spent.classList.add("pop");
    return}
  const s=e.target.closest("[data-step]");
  if(s){const [id,dv]=s.dataset.step.split(",");const inp=$(id);inp.value=Math.max(0,(parseInt(inp.value)||0)+Number(dv));return}
});
$("tradeBtn").onclick=()=>{
  const give=parseInt($("give").value)||0,get=parseInt($("get").value)||0,msg=$("tradeMsg");
  msg.classList.remove("err");
  if(give<0||get<0||(give===0&&get===0)){msg.textContent="교환할 수량을 넣어 주세요.";msg.classList.add("err");return}
  if(give>S.n.A.phone){msg.textContent=`A국 휴대폰이 부족합니다. 지금 ${S.n.A.phone}개 있습니다.`;msg.classList.add("err");return}
  if(get>S.n.B.shoe){msg.textContent=`B국 신발이 부족합니다. 지금 ${S.n.B.shoe}켤레 있습니다.`;msg.classList.add("err");return}
  S.n.A.phone-=give;S.n.B.phone+=give;S.n.B.shoe-=get;S.n.A.shoe+=get;
  S.trades.push({give,get});S.log.push({round:2,type:"trade",give,get});$("give").value=0;$("get").value=0;
  msg.textContent=`교환 완료: 휴대폰 ${give}개 ⇄ 신발 ${get}켤레`;render();
};
$("endBtn").onclick=()=>{
  const sc={A:score(S.n.A),B:score(S.n.B)};
  if(S.round===1)S.r1=sc;else S.r2=sc;
  S.phase="done";stopTimer();render();$("result").scrollIntoView({behavior:"smooth",block:"start"});
};
$("resetBtn").classList.add("lock");
$("resetBtn").onclick=()=>askPin("기록을 모두 지우고 처음부터 다시 시작합니다.",()=>{S=fresh();setTimer(1);render()});

/* 타이머 */
function showClock(){const m=Math.floor(left/60),s=left%60;$("clock").textContent=`${m}:${String(s).padStart(2,"0")}`;$("clock").classList.toggle("low",left<=30)}
function setTimer(r){stopTimer();left=ROUND_MIN[r]*60;showClock()}
function stopTimer(){clearInterval(tick);tick=null;$("timerBtn").textContent=left===0?"시간 종료":"타이머 시작"}
$("timerBtn").onclick=()=>{
  if(tick){stopTimer();$("timerBtn").textContent="계속";return}
  if(left===0)return;
  $("timerBtn").textContent="일시정지";
  tick=setInterval(()=>{left--;showClock();save();if(left<=0){left=0;stopTimer()}},1000);
};

if(!load())S=fresh();
showClock();stopTimer();render();
</script>
</body>
</html>
